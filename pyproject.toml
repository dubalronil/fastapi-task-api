[tool.pytest.ini_options]
# Puts the repo root on sys.path so tests can `import app`.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# Generated by Alembic's template, so leave them in the style it produces.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint.isort]
# The alembic/ directory makes ruff read the installed package as first-party.
known-third-party = ["alembic"]

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first run rather than queueing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          # POSTGRES_USER is created as a superuser by this image, which the
          # test suite needs: conftest.py issues CREATE DATABASE to build its
          # own test databases.
          POSTGRES_USER: tasks
          POSTGRES_PASSWORD: tasks
          POSTGRES_DB: tasks
        ports:
          - 5432:5432
        # Without a healthcheck the job races the database and fails on the
        # first connection.
        options: >-
          --health-cmd "pg_isready -U tasks -d tasks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        # Runs against the Postgres service above, in its own databases. Not
        # parallelised: the schema fixture is session-scoped and drops tables,
        # so workers would clobber each other.
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://tasks:tasks@localhost:5432/tasks_test

  docker:
    # The deployed artifact is the image, so a Dockerfile that no longer builds
    # should fail here rather than in Railway.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fastapi-task-api:ci .
